<!doctype html>
<html lang="ms">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Laporan | PPD Limbang</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="min-h-screen bg-slate-100 text-slate-800">
  <header class="bg-blue-950 text-white"><div class="mx-auto flex max-w-5xl items-center justify-between gap-4 px-4 py-5"><div><p class="text-xs font-semibold uppercase text-amber-300">PPD Limbang</p><h1 class="text-xl font-bold">Laporan dan Cetakan</h1></div><nav class="flex gap-2 text-sm"><a class="rounded px-3 py-2 hover:bg-white/15" href="index.html">Senarai</a><a class="rounded px-3 py-2 hover:bg-white/15" href="borang.html">Borang</a><a class="rounded bg-white/15 px-3 py-2" href="laporan.html">Laporan</a></nav></div></header>
  <main class="mx-auto max-w-5xl space-y-4 px-4 py-6"><section class="flex flex-wrap items-center justify-between gap-3 rounded-xl bg-white p-4 shadow-sm"><p class="text-sm text-slate-600">Pilih rekod untuk dicetak atau eksport senarai sebagai CSV.</p><button id="exportCsv" class="rounded bg-emerald-700 px-4 py-2 font-semibold text-white">Eksport CSV</button></section><section id="reportList" class="space-y-3"></section><p id="reportEmpty" class="hidden rounded-xl bg-white p-8 text-center text-slate-500">Tiada rekod untuk dipaparkan.</p><article id="printRecord" class="hidden rounded-xl bg-white p-8 shadow-sm print:!block"><div class="mb-6 border-b pb-4"><h2 class="text-center text-xl font-bold">REKOD LAWATAN SEKOLAH</h2><p class="text-center text-sm">Pejabat Pendidikan Daerah Limbang</p></div><dl class="grid grid-cols-[150px_1fr] gap-2 text-sm"><dt class="font-semibold">Sekolah</dt><dd id="printSekolah"></dd><dt class="font-semibold">Tarikh / Masa</dt><dd id="printTarikh"></dd><dt class="font-semibold">Pegawai</dt><dd id="printPegawai"></dd><dt class="font-semibold">Jawatan</dt><dd id="printJawatan"></dd><dt class="font-semibold">Status</dt><dd id="printStatus"></dd></dl><h3 class="mt-5 font-bold">Dapatan lawatan</h3><p id="printDapatan" class="whitespace-pre-line text-sm"></p><h3 class="mt-4 font-bold">Maklumbalas sekolah</h3><p id="printMaklumbalas" class="whitespace-pre-line text-sm"></p><div id="printImages" class="mt-4 flex flex-wrap gap-2"></div><button id="printButton" class="mt-5 rounded bg-blue-900 px-4 py-2 text-white print:hidden">Cetak rekod ini</button></article></main>
  <script src="app.js"></script>
</body></html>
